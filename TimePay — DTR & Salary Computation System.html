<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimePay — DTR & Salary Computation System</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#0f1e3d;--mut:#64708a;--navy:#14306b;--pri:#14306b;--blue:#2f6fe4;--soft:#e8f0fe;--green:#16803c;--gsoft:#e3f6ea;--org:#b85f00;--osoft:#fff1dc;--red:#c62828;--rsoft:#fde8e8;--line:#e3e9f4;--pur:#5b3fc4;--psoft:#ece8fb;--out:#cfd8ea}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c30;--ink:#e8eefc;--mut:#93a0bd;--navy:#8fb2ff;--pri:#2f5fc7;--blue:#6ea4ff;--soft:#1a2a4d;--green:#4ade80;--gsoft:#12301f;--org:#fbb454;--osoft:#3a2a10;--red:#ff8a8a;--rsoft:#3a1616;--pur:#b7a4ff;--psoft:#2a2250;--line:#233152;--out:#05080f;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media(min-width:500px){body{background:var(--out);display:grid;place-items:center}#app{width:390px;height:844px;max-height:96vh;border-radius:38px;box-shadow:0 24px 60px #0005;border:8px solid #0e1626}}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 92px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 8px;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;border-radius:12px}
nav button.on{color:var(--navy)}nav button.on svg{background:var(--soft)}
nav svg{width:40px;height:26px;padding:1px 8px;border-radius:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:20px}h2{font-size:15px;margin:16px 0 8px}h3{font-size:14px}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 6px #1a2d5a14;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin:0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mut{color:var(--mut);font-size:12px}.big{font-size:24px;font-weight:700}
.btn{border:0;border-radius:12px;background:var(--pri);color:#fff;font:700 14px system-ui;padding:12px 14px;min-height:44px;cursor:pointer;width:100%;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--soft);color:var(--navy)}.btn.red{background:var(--red);color:#fff}.btn.go{background:var(--green);color:#fff}
.btn.sm{width:auto;min-height:34px;padding:6px 12px;font-size:12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qa .btn{font-size:12px;padding:10px 4px;line-height:1.2}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.b{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-Present{background:var(--gsoft);color:var(--green)}.b-Late{background:var(--osoft);color:var(--org)}.b-Absent{background:var(--rsoft);color:var(--red)}.b-HalfDay{background:var(--soft);color:var(--blue)}.b-OnLeave{background:var(--psoft);color:var(--pur)}.b-Off{background:var(--line);color:var(--mut)}
.av{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-weight:700;flex:none}
.hd{background:linear-gradient(135deg,var(--pri),#3b7be8);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:11px;background:#ffffff26;display:grid;place-items:center}
.ln{display:flex;justify-content:space-between;padding:3px 0}.ln.t{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.net{background:var(--gsoft);color:var(--green);border-radius:12px;padding:10px;text-align:center;margin-top:8px}.net b{display:block;font-size:24px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;color:var(--navy);padding:8px 2px;border-radius:10px;font:600 12px system-ui;cursor:pointer}.seg .on{background:var(--card);box-shadow:0 1px 4px #0002}
.chips{display:flex;gap:6px}.chips label{margin:0;flex:1;text-align:center}.chips input{display:none}.chips span{display:block;padding:9px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:700}.chips input:checked+span{background:var(--pri);color:#fff}
.empty{text-align:center;color:var(--mut);padding:26px 10px}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
#sheet{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:#0007}#sheet.on{display:flex}#sheet.c{align-items:center;padding:20px}
.sh{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px}#sheet.c .sh{border-radius:18px}
#toast{position:absolute;left:14px;right:14px;bottom:88px;z-index:30;padding:12px 14px;border-radius:12px;color:#fff;font-weight:600;display:none}
.note{font-size:12px;color:var(--mut);background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:10px}
.err{color:var(--red);font-weight:600;font-size:13px;margin-top:8px;min-height:1px}.warn{color:var(--org)}
@media print{nav,.noprint,#toast{display:none!important}#app{height:auto;border:0;box-shadow:none}main{overflow:visible}}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px 0}.bar{width:150px;height:5px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:40%;background:var(--pri);border-radius:9px;animation:ld 1.1s ease-in-out infinite}@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style></head><body>

/* ---------- time + pay logic ---------- */
const tm=s=>{if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+m};
function hrsOf(r){const a=tm(r.tin),b=tm(r.tout);if(a==null||b==null)return 0;let m=b-a;if(m<=0)m+=1440;const s=tm(r.ls),e=tm(r.le);if(s!=null&&e!=null){let k=e-s;if(k<0)k+=1440;m-=k}return Math.max(0,m/60)}
function calc(r,e){if(!r||r.st=='Absent'||r.st=='On Leave')return{tot:0,reg:0,ot:0,ex:0};const tot=hrsOf(r),ex=Math.max(0,tot-e.hrs);return{tot,reg:Math.min(tot,e.hrs),ex,ot:Math.min(ex,+r.ot||0)}}
const mk=(t,from,to)=>({type:t,from,to,key:from+'_'+to});
function periodFor(t,a){const d=D(a);let f,e;if(t=='weekly'){f=new Date(d);f.setDate(d.getDate()-(d.getDay()+6)%7);e=new Date(f);e.setDate(f.getDate()+6)}else if(t=='semi'){const y=d.getFullYear(),m=d.getMonth();[f,e]=d.getDate()<=15?[new Date(y,m,1),new Date(y,m,15)]:[new Date(y,m,16),new Date(y,m+1,0)]}else{f=new Date(d.getFullYear(),d.getMonth(),1);e=new Date(d.getFullYear(),d.getMonth()+1,0)}return mk(t,iso(f),iso(e))}
const frac=p=>p.type=='weekly'?12/52:p.type=='semi'?.5:p.type=='monthly'?1:12*((D(p.to)-D(p.from))/864e5+1)/365;
function pay(e,p){let days=0,hrs=0,reg=0,ot=0,abs=0,lv=0;
 S.dtr.filter(r=>r.emp==e.id&&r.date>=p.from&&r.date<=p.to).forEach(r=>{const c=calc(r,e);hrs+=c.tot;reg+=c.reg;ot+=c.ot;
  if(r.st=='Present'||r.st=='Late')days++;else if(r.st=='Half Day')days+=.5;else if(r.st=='On Leave'){days++;lv++}else if(r.st=='Absent')abs++});
 const dr=e.basis=='Daily'?e.rate:e.basis=='Hourly'?e.rate*e.hrs:e.rate/21.75,hr=e.basis=='Hourly'?e.rate:dr/e.hrs;let basic,note='';
 if(e.basis=='Daily')basic=e.rate*days;
 else if(e.basis=='Hourly')basic=e.rate*(reg+lv*e.hrs);
 else{basic=e.rate*frac(p);if(S.set.abs&&abs){basic-=abs*dr;note=`Absence rule on: −${abs} day(s)`}else note='Fixed salary; absences not deducted'}
 const a=S.adj[e.id+'|'+p.key]||{},n=k=>+a[k]||0,otp=ot*hr*S.set.ot,add=n('allow')+n('bonus')+n('man'),gross=Math.max(0,basic)+otp+add,ded=['sss','ph','pi','tax','adv','oth'].reduce((s,k)=>s+n(k),0);
 return{days,hrs:e.basis=='Hourly'?reg+lv*e.hrs:hrs,ot,basic:Math.max(0,basic),otp,add,gross,ded,net:gross-ded,note,a}}

 if(rp.t=='dtr')return bar('expDtr()')+recs.map(r=>{const e=eo(r.emp),c=calc(r,e);return `<div class="card"><div class="row"><b>${esc(e.name)}</b>${bd(r.st)}</div><div class="mut">${fd(r.date)} · ${r.tin||'—'} to ${r.tout||'—'}</div><div>Total <b>${h2(c.tot)}h</b> · Reg ${h2(c.reg)} · OT ${h2(c.ot)}</div></div>`}).join('');
 if(rp.t=='daily')return bar('expDaily()')+days(rp.from,rp.to).reverse().map(d=>{const x=recs.filter(r=>r.date==d);if(!x.length)return '';const n=s=>x.filter(r=>r.st==s).length,h=x.reduce((s,r)=>s+calc(r,eo(r.emp)).tot,0);return `<div class="card"><div class="row"><b>${fd(d)}</b><span class="mut">${h2(h)} hrs</span></div><div class="mut">Present ${n('Present')} · Late ${n('Late')} · Half ${n('Half Day')} · Leave ${n('On Leave')} · Absent ${n('Absent')}</div></div>`}).join('');
 if(rp.t=='monthly')return bar('expMonthly()')+E.map(e=>{const x=recs.filter(r=>r.emp==e.id),n=s=>x.filter(r=>r.st==s).length,c=x.reduce((s,r)=>s+calc(r,e).tot,0);return `<div class="card"><b>${esc(e.name)}</b><div class="mut">${e.id}</div><div style="margin-top:4px">Present ${n('Present')} · Late ${n('Late')} · Half ${n('Half Day')} · Leave ${n('On Leave')} · Absent ${n('Absent')}</div><div>Total hours <b>${h2(c)}</b></div></div>`}).join('');
 if(!E.length)return empty('No employees','Add employees to see payroll.');
 const p=mk('custom',rp.from,rp.to),R=E.map(e=>({e,r:pay(e,p)})),t=k=>R.reduce((s,x)=>s+x.r[k],0);
 return `<div class="card"><h3>Payroll totals</h3><div class="ln"><span>Total gross payroll</span><b>${peso(t('gross'))}</b></div><div class="ln"><span>Total deductions</span><b>${peso(t('ded'))}</b></div><div class="ln t"><span>Total net payroll</span><b style="color:var(--green)">${peso(t('net'))}</b></div><div class="ln"><span class="mut">Paid days · hours</span><span>${h2(t('days'))} · ${h2(t('hrs'))}</span></div></div>`+bar('expPay()')+R.map(({e,r})=>`<div class="card"><div class="row"><b>${esc(e.name)}</b><b style="color:var(--green)">${peso(r.net)}</b></div><div class="mut">${e.basis} · ${h2(r.days)} days · ${h2(r.hrs)} hrs</div><div class="ln"><span>Gross</span><span>${peso(r.gross)}</span></div><div class="ln"><span>Deductions</span><span>${peso(r.ded)}</span></div></div>`).join('')}
const rpE=()=>rp.emp=='all'?S.emps:S.emps.filter(e=>e.id==rp.emp),rpR=()=>S.dtr.filter(r=>r.date>=rp.from&&r.date<=rp.to&&rpE().some(e=>e.id==r.emp)).sort((a,b)=>a.date.localeCompare(b.date));
function expDtr(){csv(`dtr_${rp.from}_${rp.to}.csv`,[['Date','ID','Name','Status','Time In','Lunch Start','Lunch End','Time Out','Total Hrs','Regular Hrs','OT Hrs'],...rpR().map(r=>{const e=S.emps.find(x=>x.id==r.emp),c=calc(r,e);return[r.date,e.id,e.name,r.st,r.tin,r.ls,r.le,r.tout,h2(c.tot),h2(c.reg),h2(c.ot)]})])}
function expDaily(){const R=rpR();csv(`daily_attendance_${rp.from}_${rp.to}.csv`,[['Date','Present','Late','Half Day','On Leave','Absent','Hours'],...days(rp.from,rp.to).map(d=>{const x=R.filter(r=>r.date==d);if(!x.length)return null;const n=s=>x.filter(r=>r.st==s).length;return[d,n('Present'),n('Late'),n('Half Day'),n('On Leave'),n('Absent'),h2(x.reduce((s,r)=>s+calc(r,S.emps.find(e=>e.id==r.emp)).tot,0))]}).filter(Boolean)])}
function expMonthly(){const R=rpR();csv(`attendance_${rp.from}_${rp.to}.csv`,[['ID','Name','Present','Late','Half Day','On Leave','Absent','Hours'],...rpE().map(e=>{const x=R.filter(r=>r.emp==e.id),n=s=>x.filter(r=>r.st==s).length;return[e.id,e.name,n('Present'),n('Late'),n('Half Day'),n('On Leave'),n('Absent'),h2(x.reduce((s,r)=>s+calc(r,e).tot,0))]})])}
function expPay(){const p=mk('custom',rp.from,rp.to);csv(`payroll_${rp.from}_${rp.to}.csv`,[['ID','Name','Basis','Paid Days','Hours','Basic','Overtime','Allowances/Bonuses','Gross','Deductions','Net'],...rpE().map(e=>{const r=pay(e,p);return[e.id,e.name,e.basis,h2(r.days),h2(r.hrs),h2(r.basic),h2(r.otp),h2(r.add),h2(r.gross),h2(r.ded),h2(r.net)]})])}
boot();
</script></body></html>
